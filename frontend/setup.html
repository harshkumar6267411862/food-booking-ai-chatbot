<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile — MunchBot Admin</title>
  <meta name="description" content="Set up your MunchBot admin profile to get started." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>" />
</head>
<body class="login-page">
  <div class="bg-mesh"></div>

  <div class="login-card setup-card">
    <div class="login-logo">
      <div class="logo-icon">🍔</div>
      <div class="logo-text">
        <span class="munch">Munch</span><span class="bot">Bot</span>
      </div>
    </div>

    <div class="setup-stall-banner" id="stallBanner">
      <span class="setup-stall-icon">🏪</span>
      <span id="stallBannerText">Your Stall</span>
    </div>

    <h1 class="login-title">Welcome! Set Up Your Profile</h1>
    <p class="login-subtitle">Enter your name and phone number to complete your account setup.</p>

    <form id="setupForm" novalidate>
      <div class="form-group">
        <label for="adminName">Your Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="adminName"
            name="adminName"
            placeholder="e.g. Ramesh Gupta"
            autocomplete="name"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            placeholder="e.g. 9876543210"
            autocomplete="tel"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-primary" id="setupBtn">
        Complete Setup &amp; Go to Dashboard
      </button>

      <div class="login-error" id="setupError"></div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Must be logged in
    Auth.requireAuth();

    // If profile already complete, go to dashboard
    if (Auth.getProfileComplete()) {
      window.location.href = "/admin-dashboard/index.html";
    }

    // Try to show stall name
    (async () => {
      try {
        const stall = await API.getMyStall();
        document.getElementById("stallBannerText").textContent = stall.name || "Your Stall";
        Auth.setStallName(stall.name || "");
        Auth.setStallId(stall.id);
      } catch (_) {}
    })();

    const form    = document.getElementById("setupForm");
    const btn     = document.getElementById("setupBtn");
    const errBox  = document.getElementById("setupError");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.remove("show");

      const name  = document.getElementById("adminName").value.trim();
      const phone = document.getElementById("phoneNumber").value.trim();

      if (!name || !phone) {
        errBox.textContent = "Please fill in all fields.";
        errBox.classList.add("show");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Saving…";

      try {
        const updated = await API.setupProfile(name, phone);
        Auth.setAdminName(updated.name || name);
        Auth.setProfileComplete(true);
        window.location.href = "/admin-dashboard/index.html";
      } catch (err) {
        errBox.textContent = err.message || "Failed to save profile. Please try again.";
        errBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Complete Setup & Go to Dashboard";
      }
    });
  </script>
</body>
</html>
