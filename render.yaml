services:
  - type: web
    name: munchbot-api
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: munchbot-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: PHONE_NUMBER_ID
        sync: false

      - key: VERIFY_TOKEN
        sync: false

databases:
  - name: munchbot-db
    databaseName: munchbot
    user: munchbot
    plan: free