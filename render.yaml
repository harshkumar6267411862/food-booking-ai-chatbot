services:
  - type: web
    name: munchbot-api
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

      - key: WHATSAPP_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_PROVIDER
        value: meta

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: munchbot-db
    databaseName: munchbot
    user: munchbot
    plan: free